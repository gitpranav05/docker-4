name: Deploy the backend

on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name : Checkout code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with :
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name : Build and push
        uses : docker/build-push-action@v4
        with:
          context : .
          file : ./docker/Dockerfile.be
          push : true
          tags : ${{secrets.DOCKERHUB_USERNAME}}/docker-tut-backend:${{github.sha}}

      - name : Deploy to VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
          chmod 700 /home/runner/ssh_key
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@13.127.194.19 -t "sudo docker rm -f user_backend || true && \sudo docker run --name user_backend -d -p 3001:3001 ${{ secrets.DOCKERHUB_USERNAME }}/docker-tut-backend:${{ github.sha }}"